<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maria &amp; Daniel · May 22, 2027</title>
  <meta name="description"
    content="Maria Clarke and Daniel Dierking are getting married May 22, 2027 at Old St. Patrick's Oratory in Kansas City.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --sand: #F3F5F2;
      --sea: #2B4257;
      --sky: #C7DAE8;
      --brick: #9A2E2A;
      --ink: #1E2A33;
      --mute: #56666f;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Jost", system-ui, sans-serif
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 4rem
    }

    body {
      background: var(--sand);
      color: var(--ink);
      font: 400 1.05rem/1.65 var(--sans)
    }

    a {
      color: var(--brick)
    }

    img {
      display: block;
      max-width: 100%
    }

    :focus-visible {
      outline: 3px solid var(--brick);
      outline-offset: 3px
    }

    .todo {
      background: #fff3c4;
      border-bottom: 2px dashed #c79a00
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(243, 245, 242, .94);
      backdrop-filter: blur(6px);
      display: flex;
      gap: 1.1rem;
      justify-content: center;
      flex-wrap: wrap;
      padding: .8rem 1rem;
      border-bottom: 1px solid var(--sky)
    }

    .top a {
      text-decoration: none;
      color: var(--sea);
      font-weight: 500;
      font-size: .95rem
    }

    .top a:hover {
      color: var(--brick)
    }

    .hero {
      display: grid;
      min-height: calc(100vh - 3rem)
    }

    .hero img {
      width: 100%;
      height: 58vh;
      object-fit: cover;
      object-position: 50% 62%
    }

    .hero-text {
      background: var(--sea);
      color: var(--sand);
      padding: 2.5rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .hero h1 {
      font: 500 clamp(3.4rem, 12vw, 7rem)/.92 var(--serif);
      letter-spacing: -.01em
    }

    .hero h1 i {
      display: block;
      font-weight: 400;
      font-size: .42em;
      margin: .2em 0;
      color: var(--sky)
    }

    .full {
      color: var(--sky);
      margin-top: 1rem;
      font-size: .95rem
    }

    .date {
      font: 500 1.7rem/1.2 var(--serif);
      margin-top: 1.5rem
    }

    .count {
      display: flex;
      gap: 1.4rem;
      margin-top: 1.5rem
    }

    .count div {
      font: 500 2.4rem/1 var(--serif)
    }

    .count small {
      display: block;
      font: 400 .8rem var(--sans);
      color: var(--sky)
    }

    @media(min-width:820px) {
      .hero {
        grid-template-columns: 5fr 6fr
      }

      .hero img {
        height: calc(100vh - 3rem);
        position: sticky;
        top: 3rem
      }

      .hero-text {
        padding: 4rem 5vw
      }
    }

    section {
      padding: 4.5rem 1.5rem;
      max-width: 62rem;
      margin: 0 auto
    }

    h2 {
      font: 500 clamp(2.1rem, 6vw, 3.2rem)/1.1 var(--serif);
      color: var(--sea);
      margin-bottom: 1.2rem
    }

    .prose p {
      max-width: 38rem;
      margin-bottom: 1rem;
      font-size: 1.12rem
    }

    .schedule {
      list-style: none;
      padding: 0;
      border-left: 2px solid var(--sky);
      margin-left: .4rem
    }

    .schedule li {
      position: relative;
      padding: 0 0 2.5rem 1.75rem
    }

    .schedule li::before {
      content: "";
      position: absolute;
      left: -.55rem;
      top: .45rem;
      width: .9rem;
      height: .9rem;
      border-radius: 50%;
      background: var(--sand);
      border: 2px solid var(--brick)
    }

    .schedule .main::before {
      background: var(--brick)
    }

    .when {
      font-weight: 500;
      color: var(--brick)
    }

    .schedule h3 {
      font: 600 1.8rem/1.2 var(--serif);
      color: var(--sea)
    }

    .schedule small {
      display: block;
      color: var(--mute)
    }

    .party {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
      gap: 2rem 2.5rem
    }

    .party h3 {
      font: 600 1.5rem/1.2 var(--serif);
      color: var(--sea)
    }

    .party .role {
      color: var(--brick);
      font-weight: 500;
      font-size: .95rem
    }

    .party p {
      color: var(--mute);
      margin-top: .3rem
    }

    .side {
      margin: 2rem 0 1rem;
      font: italic 1.6rem var(--serif)
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 2rem
    }

    .tiles h3 {
      font: 600 1.5rem var(--serif);
      color: var(--sea);
      margin-bottom: .3rem
    }

    details {
      border-top: 1px solid var(--sky);
      padding: 1rem 0
    }

    details:last-child {
      border-bottom: 1px solid var(--sky)
    }

    summary {
      cursor: pointer;
      font: 600 1.35rem var(--serif);
      color: var(--sea)
    }

    details p {
      margin-top: .6rem;
      max-width: 38rem
    }

    .wide {
      max-width: none;
      padding-left: 0;
      padding-right: 0
    }

    .wide>h2 {
      max-width: 62rem;
      margin: 0 auto 1.2rem;
      padding: 0 1.5rem
    }

    .strip {
      display: flex;
      gap: .75rem;
      overflow-x: auto;
      padding: 0 1.5rem;
      scroll-snap-type: x mandatory
    }

    .strip button {
      all: unset;
      cursor: zoom-in;
      flex: none;
      scroll-snap-align: center
    }

    .strip img {
      height: 26rem;
      width: auto
    }

    @media(min-width:820px) {
      .strip {
        flex-wrap: wrap;
        justify-content: center;
        overflow: visible
      }

      .strip img {
        height: 21rem
      }
    }

    dialog {
      border: 0;
      padding: 0;
      background: none;
      max-width: 95vw;
      max-height: 95vh;
      margin: auto
    }

    dialog::backdrop {
      background: rgba(20, 30, 38, .88)
    }

    dialog img {
      max-height: 90vh;
      margin: 0 auto
    }

    dialog button {
      display: block;
      margin: .6rem auto 0;
      padding: .5rem 1.2rem;
      font: inherit;
      cursor: pointer
    }

    .dark {
      background: var(--sea);
      color: var(--sand);
      max-width: none
    }

    .dark>div {
      max-width: 62rem;
      margin: 0 auto
    }

    .dark h2 {
      color: var(--sand)
    }

    .dark a.btn {
      background: var(--sand);
      color: var(--sea)
    }

    .btn {
      display: inline-block;
      margin: .8rem .8rem 0 0;
      padding: .85rem 1.7rem;
      background: var(--brick);
      color: #fff;
      font-weight: 500;
      text-decoration: none;
      border-radius: 2px
    }

    .btn:hover {
      filter: brightness(1.12)
    }

    footer {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: var(--mute);
      font: italic 1.25rem var(--serif)
    }

    @media(prefers-reduced-motion:reduce) {
      html {
        scroll-behavior: auto
      }
    }
    .top:empty { display: none }
    .gate { text-align: center }
    .gate p { max-width: 30rem; margin: 0 auto 1.2rem }
    .gate form { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap }
    .gate input { font: inherit; padding: .75rem 1rem; border: 1px solid var(--sea); background: #fff; border-radius: 2px; min-width: 15rem }
    .gate button { font: inherit; border: 0; cursor: pointer; margin: 0 }
    .err { color: var(--brick); min-height: 1.6em; margin-top: .8rem; font-weight: 500 }
  </style>
</head>

<body>
  <nav class="top" id="nav" aria-label="Sections"></nav>
  <header class="hero">
    <img src="images/proposal.jpg" alt="Maria smiling as Daniel kneels on a white-sand beach at sunset to propose">
    <div class="hero-text">
      <h1 id="names"></h1>
      <p class="full" id="full"></p>
      <p class="date" id="date"></p>
      <div class="count" id="count" aria-live="off"></div>
    </div>
  </header>
  <main id="main"></main>
  <footer id="foot"></footer>
  <dialog id="lb"><img alt=""><button>Close</button></dialog>

  <script src="site-public.js"></script>
  <script src="site.enc.js" onerror="window.ENC_MISSING=true"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    function el(tag, attrs = {}, ...kids) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : e.setAttribute(k, v);
      kids.flat().forEach(k => e.append(k)); return e
    }
    // Text with {{placeholders}} gets highlighted so leftovers are easy to spot.
    function T(s) {
      const f = document.createDocumentFragment(); String(s).split(/(\{\{[^}]*\}\})/).forEach(p => {
        if (!p) return; f.append(p.startsWith("{{") ? el("span", { class: "todo" }, p) : p)
      }); return f
    }
    const ok = u => u && !u.includes("{{");
    const maps = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
    const P = SITE_PUBLIC;

    // ---- Public title splash ----
    $("#names").append(P.bride, el("i", {}, "and"), P.groom);
    $("#full").textContent = P.brideFull + " and " + P.groomFull;
    $("#date").textContent = P.dateLabel + " · " + P.timeLabel;
    $("#foot").textContent = P.bride + " & " + P.groom + " · " + P.dateLabel + " · " + P.hashtag;

    const target = new Date(P.dateISO).getTime();
    function tick() {
      const ms = target - Date.now(); const c = $("#count");
      if (ms <= 0) { c.textContent = "Today is the day."; return }
      const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
      c.replaceChildren(...[[d, "days"], [h, "hours"], [m, "minutes"]].map(([n, l]) => el("div", {}, String(n), el("small", {}, l))))
    }
    tick(); setInterval(tick, 30000);

    // ---- Password gate ----
    const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    async function decrypt(pw) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: un(ENC.s), iterations: 600000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: un(ENC.i) }, key, un(ENC.c));
      return JSON.parse(new TextDecoder().decode(pt));
    }
    function showGate() {
      const msg = el("p", { class: "err", role: "alert" });
      const input = el("input", { type: "password", id: "pw", placeholder: "Password", autocomplete: "current-password", "aria-label": "Password" });
      const btn = el("button", { class: "btn", type: "submit" }, "Enter");
      const form = el("form", {}, input, btn);
      form.onsubmit = async e => {
        e.preventDefault(); msg.textContent = ""; btn.disabled = true; btn.textContent = "Checking...";
        try {
          const data = await decrypt(input.value);
          try { localStorage.setItem("wpw", input.value) } catch (_) { }
          render(data);
        } catch (_) {
          msg.textContent = "That password didn't work. Check your invitation and try again.";
          btn.disabled = false; btn.textContent = "Enter";
        }
      };
      $("#main").replaceChildren(el("section", { id: "gate", class: "gate" },
        el("h2", {}, "Welcome"),
        el("p", {}, "Enter the password from your invitation to see the details, photos, registry and RSVP."),
        form, msg));
    }
    async function start() {
      if (window.ENC_MISSING || typeof ENC === "undefined" || !window.crypto || !crypto.subtle) {
        $("#main").replaceChildren(el("section", { class: "gate" }, el("p", {}, "More details are coming soon.")));
        return;
      }
      let saved = null; try { saved = localStorage.getItem("wpw") } catch (_) { }
      if (saved) { try { render(await decrypt(saved)); return } catch (_) { try { localStorage.removeItem("wpw") } catch (_) { } } }
      showGate();
    }

    // ---- Private content, built only after unlock ----
    function render(S) {
      $("#main").replaceChildren(); $("#nav").replaceChildren();
      const sec = (id, title, body, cls = "") => { const s = el("section", { id, class: cls }, el("h2", {}, title), body); $("#main").append(s); return s };
      const nav = []; const add = (id, label) => nav.push([id, label]);

      sec("details", "The weekend", el("ol", { class: "schedule" }, S.events.map(e => el("li", { class: e.main ? "main" : "" },
        el("span", { class: "when" }, T(e.when)), el("h3", {}, e.title),
        e.map ? el("a", { href: maps(e.map) }, e.place) : T(e.place), ", ", T(e.address),
        el("small", {}, T(e.note)))))); add("details", "Details");

      const pb = el("div");
      ["Maria", "Daniel"].forEach(side => {
        const m = S.party.filter(p => p.side === side); if (!m.length) return;
        pb.append(el("p", { class: "side" }, side + "'s side"), el("div", { class: "party" }, m.map(p => el("div", {},
          el("h3", {}, T(p.name)), el("div", { class: "role" }, p.role), el("p", {}, T(p.bio))))))
      });
      sec("party", "Wedding party", pb); add("party", "Party");

      sec("travel", "Travel and stay", el("div", { class: "tiles" }, S.travel.map(t => el("div", {}, el("h3", {}, t.title), el("p", {}, T(t.text)),
        t.url ? (ok(t.url) ? el("a", { href: t.url }, t.link) : el("span", { class: "todo" }, t.url)) : "")))); add("travel", "Travel");

      sec("faq", "Questions", el("div", {}, S.faqs.map(f => el("details", {}, el("summary", {}, f.q), el("p", {}, T(f.a)))))); add("faq", "FAQ");

      const strip = el("div", { class: "strip" }, S.photos.map(p => {
        const i = el("img", { src: p.src, alt: p.alt, loading: "lazy" });
        const b = el("button", { "aria-label": "Enlarge photo: " + p.alt }, i); b.onclick = () => { const d = $("#lb"); d.querySelector("img").src = p.src; d.querySelector("img").alt = p.alt; d.showModal() }; return b
      }));
      sec("photos", "Photos", strip, "wide"); add("photos", "Photos");
      $("#lb").onclick = e => { if (e.target.id === "lb" || e.target.tagName === "BUTTON") $("#lb").close() };

      const rb = el("div", {}, el("p", {}, T(S.registryNote)), S.registry.map(r => ok(r.url) ? el("a", { class: "btn", href: r.url }, r.name) : el("span", { class: "btn todo" }, r.name + " " + r.url)));
      sec("registry", "Registry", rb); add("registry", "Registry");

      const R = S.rsvp;
      $("#main").append(el("section", { id: "rsvp", class: "dark" }, el("div", {}, el("h2", {}, "RSVP"),
        el("p", {}, "Please reply by ", T(R.deadline), ". Include your meal and dietary needs."),
        ok(R.formUrl) && R.formUrl ? el("a", { class: "btn", href: R.formUrl }, "Open RSVP form") : "",
        ok(R.email) ? el("a", { class: "btn", href: "mailto:" + R.email + "?subject=RSVP%20-%20" + encodeURIComponent(P.dateLabel) }, "Reply by email") : el("p", {}, "Email: ", T(R.email)),
        el("p", {}, "Questions? ", T(R.phone)))));
      add("rsvp", "RSVP");

      nav.forEach(([id, l]) => $("#nav").append(el("a", { href: "#" + id }, l)));
    }
    start();
  </script>
</body>

</html>
